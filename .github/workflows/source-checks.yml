name: Source checks

on:
  push:
    branches: [main, source-recovery-agpl-2026-11-21]
  pull_request:

permissions:
  contents: read

jobs:
  linux-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show interpreter version
        run: python3 --version
      - name: Run Linux preview unit tests
        run: cd linux-client && python3 -B -m unittest -v test_brentnet_linux.py
      - name: Check bundled routes
        run: python3 -B linux-client/brentnet_linux.py status

  windows-source-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build recovered Windows client
        run: dotnet build helper/BrentNETHelper.csproj --configuration Release
